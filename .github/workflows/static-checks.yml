name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Repository and host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Validate repository and run host tests
        run: |
          set -o pipefail
          ./tools/validate.sh --static 2>&1 | tee "$RUNNER_TEMP/host-checks.log"

      - name: Summarize failed validation
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/host-checks.log" ]]; then
            {
              echo '### Repository and host validation failure'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/host-checks.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
