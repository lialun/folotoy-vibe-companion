name: macOS checks

on:
  pull_request:
    paths:
      - "macos/**"
      - "assets/licenses/**"
      - "assets/fonts/*license*"
      - "assets/icons/weather/LICENSE*"
      - "tools/package_notices.py"
      - "docs/vibe/install*.md"
      - ".github/workflows/macos-checks.yml"
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "assets/licenses/**"
      - "assets/fonts/*license*"
      - "assets/icons/weather/LICENSE*"
      - "tools/package_notices.py"
      - "docs/vibe/install*.md"
      - ".github/workflows/macos-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Universal app, native tests and packaging
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build arm64 and x86_64; validate app, DMG and ZIP
        run: bash macos/build.sh
